services:
  youtube-uploader:
    image: ghcr.io/tupinumboor/youtube-uploader
    container_name: youtube-uploader-local
    build: .
    restart: unless-stopped

    volumes:
      - ./job:/job
      - ./.auth:/.auth

    # Obtain token.json from client_secret.json:
    #   docker compose run --rm -e PORT=4444 -p "4444:4444" youtube-uploader python oauth.py
